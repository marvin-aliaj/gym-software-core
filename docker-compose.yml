services:
  db:
    image: postgres:15
    container_name: gym-postgres
    environment:
      POSTGRES_DB: gym_management
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: my_fucking_password
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d gym_management" ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:Z

  app:
    build: .
    container_name: gym-app
    ports:
      - "8080:9092"
    depends_on:
      db:
        condition: service_healthy
    environment:
      # These override your application.properties
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/gym_management
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: my_fucking_password
      SECRET_KEY: my_secret_key_1234567890

volumes:
  postgres_data: